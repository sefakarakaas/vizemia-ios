# Xcode projesi bu dosyadan üretilir (XcodeGen): `xcodegen generate`.
# .xcodeproj depoda tutulmaz; GitHub'daki derleme her seferinde yeniden üretir.
name: VizeMia
options:
  bundleIdPrefix: com.vizemia
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Sürüm: App Store'da görünen numara. Derleme numarasını GitHub verir.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VizeMiaCekirdek:
    path: Cekirdek

targets:
  VizeMia:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: VizeMiaCekirdek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vizemia.app
        PRODUCT_NAME: VizeMia
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Yapi/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: VizeMia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: NO
    scheme:
      testTargets: []
